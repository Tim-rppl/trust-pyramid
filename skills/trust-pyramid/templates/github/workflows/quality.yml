# Trust Pyramid quality gates: deterministic checks (scripts/check.sh) on every PR.
#
# Install only the workflows for the layers the project has (references/gates.md, "CI"):
#   quality.yml         check        always (Layer 2 + gates)
#   quality-smoke.yml   smoke        when verify/ is installed (Layer 3)
#   quality-review.yml  ai-review,   when the AI reviewer is installed and the API key secret is set
#                       review-gate  (Layer 5)
# Make the status checks of the installed workflows required (Settings -> Branches). Teams also
# enable "Require review from Code Owners"; a single maintainer cannot approve their own PR, so
# skip approvals there. Private repositories on GitHub Free have no branch protection: the checks
# are then advisory (see references/gates.md, "Branch protection").
#
# Every job runs the BASE branch's copy of the gate scripts and protected files
# (scripts/trusted-check.sh): a PR that deletes a check or turns a rule off is still checked
# with the rules as they were before the PR. The PR that introduces the gates is the exception
# ("Gate bootstrap": the base has no copy yet), and says so in a warning.
name: quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung test fails the job instead of running for 6 hours
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      TRUST_GATE: ci  # failing checks are listed in the job summary (scripts/gate-log.sh)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # TODO(trust-pyramid): install dependencies for every package listed in scripts/check.sh
      - run: npm ci --prefix web && npm ci --prefix server
      - name: Checks with the base branch's rules
        run: |
          if git cat-file -e "$BASE_SHA:scripts/trusted-check.sh" 2>/dev/null; then
            git show "$BASE_SHA:scripts/trusted-check.sh" > "$RUNNER_TEMP/trusted-check.sh"
          else
            cp scripts/trusted-check.sh "$RUNNER_TEMP/trusted-check.sh"  # bootstrap: this PR adds the gates
          fi
          bash "$RUNNER_TEMP/trusted-check.sh" "$BASE_SHA"
